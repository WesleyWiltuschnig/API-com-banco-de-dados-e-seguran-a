spring.application.name=agencia-viagens-api
server.port=8080

# ---------- Conexao PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:agencia_viagens}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=public

# ---------- Carga inicial via data.sql ----------
# defer-datasource-initialization=true garante a ordem correta:
# Hibernate cria o schema -> data.sql insere os dados.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=false

# DataInitializer (carga programatica) desativado para nao duplicar o data.sql.
# Para usar a carga via Java no lugar do SQL: app.seed.enabled=true e spring.sql.init.mode=never
app.seed.enabled=false
app.seed.admin-username=admin
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.user-username=user
app.seed.user-password=${SEED_USER_PASSWORD:user123}

# ---------- Logs SQL ----------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
# Log de parametros (inclui hash de senha) apenas no perfil dev:
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ---------- Serializacao de Page ----------
spring.data.web.pageable.serialization-mode=VIA_DTO

# ---------- Pool de conexoes ----------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ---------- Tratamento de erros ----------
server.error.include-message=always
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
